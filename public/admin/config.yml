backend:
  name: github
  repo: Dilupa-Sandika/702o2-local
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  # 1. 📅 EVENTS CALENDAR
  - name: "events"
    label: "📅 Vegas Events Calendar"
    folder: "src/content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}-{{hour}}{{minute}}{{second}}"
    fields:
      - { label: "Event Title", name: "title", widget: "string" }
      - label: "Event Daily Schedules (Add multiple dates if multi-day)"
        name: "schedules"
        widget: "list"
        required: false
        fields:
          - { label: "Schedule Date", name: "eventDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
          - { label: "Start Time (From)", name: "startTime", widget: "datetime", date_format: false, time_format: "hh:mm A", format: "hh:mm A", default: "09:00 AM" }
          - { label: "End Time (To)", name: "endTime", widget: "datetime", date_format: false, time_format: "hh:mm A", format: "hh:mm A", required: false }
          - { label: "Schedule Label / Notes (Optional)", name: "label", widget: "string", required: false, placeholder: "e.g. Day 1: Morning Market or Gates Open" }
      - { label: "Legacy / Fallback Date Text", name: "legacyDate", widget: "string", required: false, placeholder: "e.g. Every Saturday • 9:00 AM – 2:00 PM" }
      - { label: "Venue / Location", name: "location", widget: "string" }
      - { label: "Google Maps Link", name: "mapLink", widget: "string", required: false }
      - { label: "Category", name: "category", widget: "select", options: ["Family & Kids", "Community Festivals", "Food & Markets", "Nightlife & Music", "Free Community Events"] }
      - { label: "Admission / Ticket", name: "admission", widget: "string", default: "Free Entry" }
      - { label: "Official Link / Tickets", name: "link", widget: "string", required: false }
      - { label: "Event Poster / Image", name: "image", widget: "image", required: false }
      - { label: "Full Event Description", name: "body", widget: "markdown" }

  # 2. 🖼️ LOCAL SIGHTS & EVENT GALLERIES
  - name: "galleries"
    label: "🖼️ Vegas Sights & Event Galleries"
    folder: "src/content/galleries"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}-{{hour}}{{minute}}{{second}}"
    fields:
      - { label: "Gallery Title", name: "title", widget: "string" }
      - { label: "Captured Date", name: "pubDate", widget: "datetime" }
      - { label: "Category", name: "category", widget: "select", options: ["Vegas Sights & Landscapes", "Community Festivals", "Kids Parties & Setups", "Local Gatherings & Markets"] }
      - { label: "Cover Photo", name: "coverImage", widget: "image" }
      - label: "Photo Set (Upload Multiple)"
        name: "photos"
        widget: "list"
        field: { label: "Photo", name: "image", widget: "image" }
      - { label: "Story / Location Notes", name: "body", widget: "markdown" }

  # 3. 📸 MEDIA PHOTOGRAPHY PACKAGES
  - name: "mediaPackages"
    label: "📸 Media Photography Packages"
    folder: "src/content/media-packages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Package Title", name: "title", widget: "string", placeholder: "e.g. 2-Hour Event Coverage" }
      - { label: "Price / Tag", name: "price", widget: "string", placeholder: "e.g. $199 or Custom" }
      - { label: "Display Order", name: "order", widget: "number", default: 1 }
      - { label: "Highlight as Most Popular?", name: "isFeatured", widget: "boolean", default: false }
      - { label: "Short Description", name: "description", widget: "string" }
      - label: "Bullet Features"
        name: "features"
        widget: "list"
        field: { label: "Feature item", name: "feature", widget: "string" }
      - { label: "Button Text", name: "buttonText", widget: "string", default: "Book Now →" }

  # 4. 🏷️ DEALS & STEALS
  - name: "deals"
    label: "🏷️ Vegas Deals & Steals"
    folder: "src/content/deals"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}-{{hour}}{{minute}}{{second}}"
    fields:
      - { label: "Deal Title", name: "title", widget: "string" }
      - { label: "Store / Platform", name: "store", widget: "select", options: ["La Bonita", "Mariana's Supermarket", "Smith's", "Walmart", "Trader Joe's", "Costco", "Amazon", "Local Retail / Other"] }
      - { label: "Deal Date", name: "pubDate", widget: "datetime" }
      - { label: "Valid Until Date", name: "validUntil", widget: "datetime", required: false }
      - { label: "Price / Offer Tag", name: "price", widget: "string", required: false }
      - { label: "Featured Cover Image", name: "image", widget: "image", required: false }
      - { label: "Weekly Circular PDF (Upload)", name: "circularPdf", widget: "file", required: false }
      - label: "Additional Circular Pages (Images)"
        name: "circularPages"
        widget: "list"
        required: false
        field: { label: "Circular Page Image", name: "image", widget: "image" }
      - { label: "Official Store Link", name: "link", widget: "string", required: false }
      - { label: "Deal Breakdown / Details", name: "body", widget: "markdown" }

  # 5. 📖 LOCAL GUIDES & CONSUMER REPORTS
  - name: "guides"
    label: "📖 Guides & Consumer Reports"
    folder: "src/content/guides"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Article Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Best of Vegas", "Consumer Reports & Hacks", "Walmart & Amazon Guides", "Food & Dining", "Family Living"] }
      - { label: "Published Date", name: "pubDate", widget: "datetime" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Short Excerpt", name: "excerpt", widget: "string" }
      - { label: "SEO Keywords", name: "seoKeywords", widget: "string", required: false }
      - { label: "Full Article Content", name: "body", widget: "markdown" }

  # 6. 🍳 BUDGET RECIPES & KITCHEN HACKS
  - name: "recipes"
    label: "🍳 Budget Recipes & Kitchen"
    folder: "src/content/recipes"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Recipe Title", name: "title", widget: "string" }
      - { label: "Prep / Cook Time", name: "time", widget: "string", default: "20 Mins" }
      - { label: "Cost Per Serving", name: "cost", widget: "string", default: "Under $5" }
      - { label: "Published Date", name: "pubDate", widget: "datetime" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "SEO Keywords", name: "seoKeywords", widget: "string", required: false }
      - { label: "Ingredients & Instructions", name: "body", widget: "markdown" }